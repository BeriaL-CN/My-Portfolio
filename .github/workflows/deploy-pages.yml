name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pull the shared resume data at build time. The browser only receives the
      # bundled JSON in dist, so the live site is not dependent on GitHub raw.
      - name: Sync public resume JSON
        run: |
          curl --fail --location \
            "https://raw.githubusercontent.com/BeriaL-CN/digital_resume/main/resume_data_jiepeng_huang.json" \
            --output src/data/resume_data_jiepeng_huang.json
          # Fail fast if the shared data source ever stops being valid JSON.
          node -e "JSON.parse(require('fs').readFileSync('src/data/resume_data_jiepeng_huang.json', 'utf8'))"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
